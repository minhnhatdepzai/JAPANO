name: Android release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JAPANO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/japano-release.jks"

      - name: Build signed APK
        working-directory: mobile/android
        env:
          JAPANO_UPLOAD_STORE_FILE: ${{ runner.temp }}/japano-release.jks
          JAPANO_UPLOAD_STORE_PASSWORD: ${{ secrets.JAPANO_ANDROID_STORE_PASSWORD }}
          JAPANO_UPLOAD_KEY_ALIAS: ${{ secrets.JAPANO_ANDROID_KEY_ALIAS }}
          JAPANO_UPLOAD_KEY_PASSWORD: ${{ secrets.JAPANO_ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release files
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk JAPANO-1.0.20.apk
          sha256sum JAPANO-1.0.20.apk > JAPANO-1.0.20.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            JAPANO-1.0.20.apk
            JAPANO-1.0.20.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: JAPANO-1.0.20
          path: |
            JAPANO-1.0.20.apk
            JAPANO-1.0.20.apk.sha256
